<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DSH Desktop</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1220;
        color: #e2e8f0;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      .box { text-align: center; max-width: 520px; padding: 24px; }
      .spinner {
        width: 44px; height: 44px; margin: 0 auto 20px;
        border: 4px solid rgba(45, 212, 191, 0.2);
        border-top-color: #2dd4bf;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
      p { color: #94a3b8; font-size: 13px; margin: 4px 0; }
      .error { color: #f87171; white-space: pre-wrap; }
      .buttons { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
      button {
        background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
        border-radius: 8px; padding: 8px 18px; font-size: 13px; cursor: pointer;
      }
      button.primary { background: #0d9488; border-color: #0d9488; color: #fff; }
      button:hover { filter: brightness(1.15); }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner" id="spinner"></div>
      <h1 id="title">正在启动 DSH 服务器…</h1>
      <p id="subtitle"></p>
      <div id="errorBox" class="hidden">
        <p class="error" id="errorText"></p>
        <div class="buttons">
          <button class="primary" id="retryBtn">重试</button>
          <button id="settingsBtn">设置</button>
          <button id="logsBtn">日志</button>
        </div>
      </div>
    </div>
    <script src="loading.js"></script>
  </body>
</html>
